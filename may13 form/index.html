<html lang="en">

<head>
    <meta charset="UTF-8">

    <title>Document</title>
</head>

<body>

        <div>
            <label for="">Files Upload Form</label>
            <p>Please fil out the form to upload your files.</p>
        </div>

        <div>
            <label for="">Name: </label>
            <input type="text" name="" id="" placeholder="enter your name">
        </div>
        <div>
            <label for="">Email Address</label>
            <input type="email" name="" id="" placeholder="enter your email">
        </div>
        <div>
            <label for="">Type of Files</label><br>
            <input type="checkbox" name="" id=""> Image files
            <input type="checkbox" name="" id=""> Video files <br>
            <input type="checkbox" name="" id=""> Document files
            <input type="checkbox" name="" id=""> Audio files <br>
            <input type="checkbox" name="" id=""> others
        </div>

        <div>
            <label for="">Upload Files</label><br>
            <p>select multiple files to upload</p>
            <input type="file" name="" id="">
        </div>

        <div>
            <input type="checkbox" name="" id=""> I agree to the terms and conditions for uploading files  to this services. 
        </div>

        <button>Upload Files</button>

    </form>
</body>

</html>
